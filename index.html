<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="description" content="Delhi Metro trains, moving on a map.">
<title>Maptro</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="anonymous">
<style>
/* Tokens. DESIGN.md explains each one; change them there and here together. */
:root{
  color-scheme:dark;
  /* layers: true black page, then greys stepping up. Colour is for lines and state only. */
  --bg:#000; --surface:#0d0d0d; --surface2:#1c1c1c; --line:#2a2a2a;
  --ink:#f4f4f4; --muted:#8f8f8f; --faint:#5e5e5e;
  /* state */
  --live:#3ddc84; --sim:#f5c400; --focus:rgba(255,255,255,.7);
  /* "do this" is white: an inverted pill */
  --act:#f4f4f4; --act-ink:#000;
  --tap:44px; --r-pill:22px; --r-sheet:24px; --r-row:14px;
  /* motion: reuse these, never invent a new curve for one element */
  --fold:cubic-bezier(.32,.72,0,1);     /* 520ms: menu, chevron */
  --settle:cubic-bezier(.25,.6,.3,1);   /* 320-420ms: sheets in and out, fades */
  --spring:cubic-bezier(.3,1.6,.5,1);   /* 340ms: press release */
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100svh;background:var(--bg);color:var(--ink);font:15px/1.4 var(--font);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#map,#gl{position:fixed;inset:0;width:100%;height:100%;background:var(--bg)}
#gl{touch-action:none;display:none}
#labels{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
/* the status bar area stays black so the map never runs under the clock */
.notch{position:fixed;z-index:7;top:0;left:0;right:0;height:var(--sat);background:var(--bg)}
/* panels: solid near-black with a hairline. No blur or shadow: they sit over a map that redraws every frame. */
.panel{background:var(--surface);border:1px solid var(--line)}
/* press feedback: instant on press, springs back on release */
.press{transition:transform 340ms var(--spring)}
.press:active,.hw:active>.press{transform:scale(.95);transition:none}
/* haptics: an invisible native switch over a control, so iOS gives its own tick */
.hw{position:relative;display:inline-flex;flex:none}
.hx{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.top{position:fixed;z-index:5;top:calc(var(--sat) + 10px);left:calc(var(--sal) + 12px);right:calc(var(--sar) + 12px);display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.top>*{pointer-events:auto}
.pill{height:var(--tap);border-radius:var(--r-pill);display:flex;align-items:center;gap:10px;padding:0 16px 0 14px;font-weight:600;white-space:nowrap}
#pickw{flex:0 1 auto;min-width:0}
#pick{min-width:0;max-width:100%}
#pick .lbl{overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;flex:none}.dots i{width:12px;height:12px;border-radius:50%;margin-right:-4px;box-shadow:0 0 0 2px var(--surface)}
.dots:empty{display:none}
.chev{width:12px;height:12px;flex:none;opacity:.6;transition:transform 520ms var(--fold)}
#pick[aria-expanded=true] .chev{transform:rotate(180deg)}
#clockw{margin-left:auto}
#clock{gap:8px;padding:0 14px;font-variant-numeric:tabular-nums}
/* the clock is only a control while simulating: live time can't be sped up */
#clockw:not(.sim){pointer-events:none}
#clockw:not(.sim) .hx{display:none}
#clock .k{width:9px;height:9px;flex:none;opacity:.55;margin-left:-2px}
#clockw:not(.sim) #clock .k{display:none}
#livew[hidden],#dirw[hidden]{display:none}
#live{padding:0 14px 0 12px;gap:7px;font-size:14px}
#live::before{content:"";width:6px;height:6px;border-radius:50%;box-shadow:0 0 0 1.5px var(--live)}
/* direction: a native select laid invisibly over a pill, so the phone's own picker opens */
.top2{position:fixed;z-index:5;top:calc(var(--sat) + 62px);left:calc(var(--sal) + 12px);right:calc(var(--sar) + 12px);display:flex;pointer-events:none}
.top2>*{pointer-events:auto}
#dirw{max-width:100%;transition:opacity 320ms var(--settle),transform 420ms var(--settle)}
#dirw.off{opacity:0;transform:translateY(-6px);pointer-events:none}
#dir{max-width:100%;min-width:0;gap:8px;padding:0 14px 0 12px;font-size:14px}
#dir .ar{width:16px;height:16px;flex:none;opacity:.8}
#dir .lbl{overflow:hidden;text-overflow:ellipsis}
#dsel{font-size:16px;-webkit-appearance:menulist;color:#000}
/* "19 trains active": a small note that drops in under the controls, then leaves */
#pop{position:fixed;z-index:4;top:calc(var(--sat) + 64px);left:50%;height:34px;border-radius:17px;padding:0 14px 0 11px;display:flex;align-items:center;gap:8px;
  font-size:14px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:none;
  transform:translate(-50%,0);transition:opacity 320ms var(--settle),transform 340ms var(--spring)}
#pop.off{opacity:0;transform:translate(-50%,-8px) scale(.96);transition:opacity 420ms var(--settle),transform 420ms var(--settle)}
body.dir #pop{top:calc(var(--sat) + 114px)}
#pop .dots i{box-shadow:0 0 0 2px var(--surface)}
#clock .t{font-weight:650;letter-spacing:.2px}
#clock .s{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
#clock .s::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--live);animation:pulse 2s ease-in-out infinite}
#clock.sim .s::before{background:var(--sim);animation:none}
@keyframes pulse{50%{opacity:.3}}
/* line picker: a dropdown that unfolds from the pill */
#menu{position:fixed;z-index:6;top:calc(var(--sat) + 62px);left:calc(var(--sal) + 12px);width:min(320px,calc(100vw - 24px));border-radius:var(--r-sheet);padding:6px;max-height:calc(100svh - var(--sat) - var(--sab) - 140px);overflow:auto;scrollbar-width:none;
  transform-origin:24px 0;transition:opacity 320ms var(--settle),transform 520ms var(--fold)}
#menu::-webkit-scrollbar{display:none}
#menu[hidden]{display:block;opacity:0;transform:scale(.94) translateY(-8px);pointer-events:none;visibility:hidden;transition:opacity 240ms var(--settle),transform 320ms var(--settle),visibility 0s 320ms}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:var(--tap);padding:0 12px;border-radius:var(--r-row)}
.row::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--surface2);opacity:0;pointer-events:none}
.row:active::after{opacity:1}
.row>:not(.hx){position:relative;z-index:1}
.row>.hx{z-index:2}
.row .sw{width:22px;height:22px;border-radius:50%;flex:none;border:2px solid var(--c);display:grid;place-items:center;position:relative}
.row .sw::before{content:"";position:absolute;inset:-2px;border-radius:50%;background:var(--c);opacity:0;transform:scale(.6);transition:opacity 240ms var(--settle),transform 340ms var(--spring)}
.row .sw svg{width:12px;height:12px;opacity:0;transform:scale(.5);transition:opacity 240ms var(--settle),transform 340ms var(--spring);position:relative}
.row input:checked+.sw::before,.row input:checked+.sw svg{opacity:1;transform:none}
.row .nm{flex:1;font-weight:550}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 2px 12px;color:var(--muted);font-size:13px;font-weight:600}
.mhead .ac{display:flex}
.mhead button{color:var(--ink);font-size:14px;font-weight:600;min-height:var(--tap);padding:0 10px}
/* sheets: train or station card, and the quiet-hours note */
.sheet{position:fixed;z-index:4;left:calc(var(--sal) + 12px);right:calc(var(--sar) + 12px);bottom:calc(var(--sab) + 12px);margin:0 auto;max-width:420px;border-radius:var(--r-sheet);padding:16px 18px;
  transition:opacity 320ms var(--settle),transform 420ms var(--settle)}
.sheet[hidden]{display:block;opacity:0;transform:translateY(24px);pointer-events:none;visibility:hidden;transition:opacity 240ms var(--settle),transform 320ms var(--settle),visibility 0s 320ms}
#card .hd{display:flex;align-items:center;gap:10px}
#card .bar{width:6px;align-self:stretch;border-radius:3px;flex:none}
#card .ti{font-weight:700;font-size:17px;line-height:1.25}
#card .su{color:var(--muted);font-size:14px}
#card .su i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
/* 32px circle drawn, 44px to touch */
#card .xw{margin:-6px -8px 0 auto;align-self:flex-start}
#card .x{width:var(--tap);height:var(--tap);display:grid;place-items:center}
#card .x span{width:32px;height:32px;border-radius:50%;background:var(--surface2);display:grid;place-items:center}
#card .bd{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.nx{display:flex;align-items:baseline;gap:10px}
.nx .w{font-variant-numeric:tabular-nums;font-weight:700;font-size:22px;min-width:3.2em}
.nx .w small{font-size:13px;font-weight:600;color:var(--muted);margin-left:2px}
.nx .d{color:#cfcfcf;font-size:14px;line-height:1.3}
.nx .d b{color:var(--ink)}
.nx i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
#card .ft{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:10px}
.tag{font-size:13px;color:var(--faint);font-weight:600}
.btn{height:var(--tap);padding:0 18px;border-radius:var(--r-pill);background:var(--surface2);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.btn.on,.btn.act{background:var(--act);color:var(--act-ink)}
#toast{text-align:center}
#toast b{display:block;font-size:16px}
#toast span{color:var(--muted);font-size:14px}
#toast .hw{margin-top:12px}
/* disclaimer: native <details> */
#disc{position:fixed;z-index:3;left:calc(var(--sal) + 12px);bottom:calc(var(--sab) + 12px);border-radius:var(--r-pill);max-width:min(360px,calc(100vw - 24px));font-size:13px;color:var(--muted);transition:opacity 240ms var(--settle)}
#disc[open]{border-radius:18px}
#disc summary{list-style:none;cursor:pointer;min-height:var(--tap);display:flex;align-items:center;gap:6px;padding:0 14px;font-weight:600;font-size:13px}
#disc summary::-webkit-details-marker{display:none}
#disc summary svg{width:10px;height:10px;transition:transform 520ms var(--fold);opacity:.7}
#disc[open] summary svg{transform:rotate(180deg)}
#disc p{margin:0;padding:0 14px 12px;line-height:1.45}
#disc a{color:#c8c8c8}
body.carded #disc{opacity:0;pointer-events:none}
.maplibregl-ctrl-bottom-right{bottom:var(--sab)!important;right:var(--sar)!important}
.maplibregl-ctrl-attrib{background:#000a!important;color:var(--faint)!important;font-size:10px}
.maplibregl-ctrl-attrib a{color:var(--muted)!important}
.maplibregl-ctrl-attrib-button{filter:invert(1);opacity:.5}
.err{position:fixed;inset:0;display:grid;place-content:center;gap:14px;justify-items:center;color:var(--muted);padding:24px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>
<div id="map"></div>
<canvas id="gl" aria-label="Map of Delhi Metro trains"></canvas>
<canvas id="labels" aria-hidden="true"></canvas>
<div class="notch"></div>

<div class="top">
  <span class="hw" id="pickw"><button id="pick" class="pill panel press" aria-expanded="false" aria-controls="menu">
    <span class="dots" id="dots"></span><span class="lbl" id="plbl">Lines</span>
    <svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4.5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button></span>
  <span class="hw" id="clockw"><button id="clock" class="pill panel press" aria-label="Time now"><span class="t" id="time">--:--</span><span class="s" id="spd">Live</span><svg class="k" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5l3.5 3.5-3.5 3.5M5.5 1.5L9 5 5.5 8.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></span>
  <span class="hw" id="livew" hidden><button id="live" class="pill panel press" aria-label="Back to live time">Live</button></span>
</div>
<div class="top2">
  <span class="hw off" id="dirw"><span id="dir" class="pill panel press" aria-hidden="true">
    <svg class="ar" viewBox="0 0 16 16"><path d="M2.5 5.5h10m0 0L10 3m2.5 2.5L10 8M13.5 10.5h-10m0 0L6 8m-2.5 2.5L6 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="lbl" id="dlbl">Both directions</span>
    <svg class="chev" viewBox="0 0 12 12"><path d="M2 4.5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </span><select id="dsel" class="hx" aria-label="Direction"></select></span>
</div>
<div id="pop" class="panel off" aria-live="polite"><span class="dots" id="popd"></span><span id="popt"></span></div>

<div id="menu" class="panel" aria-label="Choose lines" hidden>
  <div class="mhead"><span>Lines</span><span class="ac"><span class="hw"><button id="all" class="press">All</button></span><span class="hw"><button id="none" class="press">None</button></span></span></div>
  <div id="rows"></div>
</div>

<div id="card" class="sheet panel" hidden aria-live="polite"></div>
<div id="toast" class="sheet panel" hidden></div>

<details id="disc" class="panel">
  <summary>Disclaimer <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 7.5l4-4 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
  <p>A personal project, not affiliated with DMRC. Trains are drawn where the published timetable says they should be, so positions are scheduled or estimated, not live.
  <span id="attr">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors, tiles by <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> (<a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a>).</span></p>
</details>

<script>
/*<core>*/
// Pure timetable and geometry logic. Node-tested in tests/positions.test.mjs; keep it free of DOM access.
const DAY = 86400;
const nowIST = (ms = Date.now()) => (((ms / 1000 + 19800) % DAY) + DAY) % DAY;
function merc(lon, lat) {
  const s = Math.sin(lat * Math.PI / 180);
  return [(lon + 180) / 360, 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)];
}
function unmerc(x, y) {
  return [x * 360 - 180, 360 / Math.PI * Math.atan(Math.exp((1 - 2 * y) * Math.PI)) - 90];
}
// Adds sorted starts, duration and Mercator copies of each shape to the routes in data.json.
function prepare(D) {
  for (const r of D.routes) {
    r.starts = [...r.starts].sort((a, b) => a - b);
    r.dur = r.pat[r.pat.length - 1][1];
    const n = r.shape.length;
    r.mx = new Float64Array(n); r.my = new Float64Array(n); r.md = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      const [lon, lat, d] = r.shape[i], m = merc(lon, lat);
      r.mx[i] = m[0]; r.my[i] = m[1]; r.md[i] = d;
    }
  }
  return D;
}
// Where a train is `e` seconds after leaving its first stop: shape distance, pattern index, dwelling or not.
function stateAt(r, e) {
  const p = r.pat, last = p.length - 1;
  if (e <= 0) return { d: p[0][3], i: 0, dwell: true };
  if (e >= r.dur) return { d: p[last][3], i: last, dwell: true };
  let lo = 0, hi = last;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (p[m][1] <= e) lo = m; else hi = m; }
  const a = p[lo];
  if (e <= a[2]) return { d: a[3], i: lo, dwell: true };
  const b = p[lo + 1], f = Math.min(1, (e - a[2]) / ((b[1] - a[2]) || 1));
  return { d: a[3] + (b[3] - a[3]) * f, i: lo, dwell: false };
}
// Mercator point and unit tangent at shape distance d.
function posAt(r, d) {
  const n = r.md.length;
  let lo = 0, hi = n - 1;
  if (d <= r.md[0]) hi = 1; else if (d >= r.md[n - 1]) lo = n - 2;
  else while (hi - lo > 1) { const m = (lo + hi) >> 1; if (r.md[m] <= d) lo = m; else hi = m; }
  const f = Math.max(0, Math.min(1, (d - r.md[lo]) / ((r.md[hi] - r.md[lo]) || 1)));
  let tx = r.mx[hi] - r.mx[lo], ty = r.my[hi] - r.my[lo];
  const L = Math.hypot(tx, ty) || 1; tx /= L; ty /= L;
  return [r.mx[lo] + (r.mx[hi] - r.mx[lo]) * f, r.my[lo] + (r.my[hi] - r.my[lo]) * f, tx, ty];
}
// Unit heading at shape distance d, averaged over +-span metres so a train turns smoothly through a bend
// instead of snapping at each shape vertex.
function headingAt(r, d, span = 45) {
  const end = r.md[r.md.length - 1], a = posAt(r, Math.max(r.md[0], d - span)), b = posAt(r, Math.min(end, d + span));
  const tx = b[0] - a[0], ty = b[1] - a[1], L = Math.hypot(tx, ty);
  return L > 0 ? [tx / L, ty / L] : [a[2], a[3]];
}
// Splits each line's routes into two directions, A to B (dir 0) and B to A (dir 1), and names the ends.
// Routes ending in _R run the other way to their pair. The estimated Airport and Magenta extensions were
// built leaving the existing terminal, which is the opposite sense to the rest of their line, so they flip.
const DIR_FLIP = new Set(['E_airport', 'E_magenta_kpe']);
const DIR_ENDS = { MAGENTA: ['Majlis Park', 'Botanical Garden'] }; // a horseshoe: the farthest-apart rule picks the wrong end
function directions(D) {
  const out = {}, nm = id => D.stops[id][0];
  for (const r of D.routes) { const rev = r.id.endsWith('_R'), base = rev ? r.id.slice(0, -2) : r.id; r.dir = (rev ? 1 : 0) ^ (DIR_FLIP.has(base) ? 1 : 0); }
  for (const line of new Set(D.routes.map(r => r.line))) {
    const rs = D.routes.filter(r => r.line === line), f = rs.filter(r => r.dir === 0);
    if (!f.length || !rs.some(r => r.dir === 1)) continue;
    const first = r => r.pat[0][0], last = r => r.pat[r.pat.length - 1][0];
    let a, b;
    if (DIR_ENDS[line]) [a, b] = DIR_ENDS[line];
    else {
      const main = f.reduce((x, y) => (y.dur > x.dur ? y : x)), bId = last(main), bs = D.stops[bId];
      const far = id => Math.hypot(D.stops[id][1] - bs[1], D.stops[id][2] - bs[2]);
      const cands = [...f.map(first), ...rs.filter(r => r.dir === 1).map(last)];
      a = nm(cands.reduce((x, y) => (far(y) > far(x) ? y : x))); b = nm(bId);
    }
    out[line] = { a, b };
  }
  return out;
}
function lowerBound(a, v) { let lo = 0, hi = a.length; while (lo < hi) { const m = (lo + hi) >> 1; if (a[m] < v) lo = m + 1; else hi = m; } return lo; }
// Every train running at time t (seconds of the India day) on the given lines.
function trainsAt(routes, t, lines) {
  const out = [];
  for (const r of routes) {
    if (lines && !lines.has(r.line)) continue;
    for (const tt of [t, t + DAY]) {
      const s = r.starts;
      for (let k = lowerBound(s, tt - r.dur); k < s.length && s[k] <= tt; k++) {
        const e = tt - s[k], st = stateAt(r, e), p = r.pat;
        const next = st.dwell ? p[st.i] : p[st.i + 1];
        out.push({ r, s0: s[k], e, d: st.d, i: st.i, dwell: st.dwell,
          at: st.dwell ? p[st.i][0] : null, next: next[0], eta: s[k] + next[1], pos: posAt(r, st.d) });
      }
    }
  }
  return out;
}
// Points along the track the train covered in the last `back` seconds, oldest first, with 0..1 progress.
function trailPoints(r, e, back) {
  const d1 = stateAt(r, e).d, d0 = stateAt(r, e - back).d;
  if (d1 - d0 < 1) return [];
  const pts = [], a = posAt(r, d0);
  pts.push([a[0], a[1], 0]);
  let i = lowerBound(r.md, d0 + 1e-6);
  for (; i < r.md.length && r.md[i] < d1; i++) pts.push([r.mx[i], r.my[i], (r.md[i] - d0) / (d1 - d0)]);
  const b = posAt(r, d1);
  pts.push([b[0], b[1], 1]);
  return pts;
}
// Next departures from any of `stopIds` on the given lines after time t, soonest first.
function departures(routes, stopIds, t, lines, max = 4) {
  const res = [];
  for (const r of routes) {
    if (lines && !lines.has(r.line)) continue;
    const p = r.pat;
    for (let j = 0; j < p.length - 1; j++) {
      if (!stopIds.has(p[j][0])) continue;
      let best = Infinity;
      for (const s0 of r.starts) {

  sel = new Set((Array.isArray(saved) ? saved : DEFAULT).filter(l => lines.includes(l)));
  dirs = directions(D); setActive();
  buildMenu(); paintPicker(); paintDir(); paintClock();
  gpu = makeGpu(); buildStatic(); selDirty = false;
  try { cam = ml ? mapLibreCamera(ml) : canvasCamera(); await cam.ready; }
  catch (e) { try { if (cam && cam.map) cam.map.remove(); cam = canvasCamera(); } catch (e2) { document.body.insertAdjacentHTML('beforeend', '<div class="err">This map needs WebGL, which this browser has turned off.</div>'); return; } }
  cam.fit(selBounds(), false);
  document.documentElement.dataset.ready = cam.kind;
  // used by the screenshot script to find a train to tap
  window.__maptro = { trainsOnScreen: () => trains.map(o => cam.project(o.pos[0], o.pos[1])), view: (lon, lat, z) => cam.map && cam.map.jumpTo({ center: [lon, lat], zoom: z }) };
  requestAnimationFrame(frame);
}).catch(e => { document.body.insertAdjacentHTML('beforeend', '<div class="err"><span>Couldn\'t load the timetable.</span><button class="btn act press" onclick="location.reload()">Tap to reload</button></div>'); console.error(e); });
})();
</script>
