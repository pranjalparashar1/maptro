<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Delhi Metro trains, moving on a map.">
<title>Maptro</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="anonymous">
<style>
:root{
  color-scheme:dark;
  --bg:#07090f; --ink:#f2f4f8; --mute:#8e97a9; --faint:#5b6375;
  --glass:rgba(20,24,34,.62); --glass-hi:rgba(34,40,54,.72); --edge:rgba(255,255,255,.09);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 var(--font);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,summary:focus-visible,label:focus-within{outline:2px solid #fff6;outline-offset:2px}
#map,#gl{position:fixed;inset:0;width:100%;height:100%;background:var(--bg)}
#gl{touch-action:none;display:none}
#labels{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:.5px solid var(--edge);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.top{position:fixed;z-index:5;top:calc(var(--sat) + 10px);left:calc(var(--sal) + 12px);right:calc(var(--sar) + 12px);display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.top>*{pointer-events:auto}
.pill{height:44px;border-radius:22px;display:flex;align-items:center;gap:10px;padding:0 16px 0 14px;font-weight:600;white-space:nowrap;transition:transform .2s cubic-bezier(.2,.8,.2,1),background .2s}
.pill:active{transform:scale(.96)}
#pick{flex:0 1 auto;min-width:0}
#pick .lbl{overflow:hidden;text-overflow:ellipsis}
#pick .n{color:var(--mute);font-weight:500;font-variant-numeric:tabular-nums}
.dots{display:flex;flex:none}.dots i{width:12px;height:12px;border-radius:50%;margin-right:-4px;box-shadow:0 0 0 2px #151a25}
.dots:empty{display:none}
.chev{width:12px;height:12px;flex:none;opacity:.6;transition:transform .25s}
#pick[aria-expanded=true] .chev{transform:rotate(180deg)}
#clock{margin-left:auto;flex:none;gap:8px;padding:0 14px;font-variant-numeric:tabular-nums}
#clock .t{font-weight:650;letter-spacing:.2px}
#clock .s{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--mute);display:flex;align-items:center;gap:5px}
#clock .s::before{content:"";width:6px;height:6px;border-radius:50%;background:#3ddc84;box-shadow:0 0 8px #3ddc84;animation:pulse 2s infinite}
#clock.sim .s::before{background:#f5c400;box-shadow:0 0 8px #f5c400}
@keyframes pulse{50%{opacity:.35}}
/* line picker */
#menu{position:fixed;z-index:6;top:calc(var(--sat) + 62px);left:calc(var(--sal) + 12px);width:min(320px,calc(100vw - 24px));border-radius:22px;padding:6px;max-height:calc(100dvh - var(--sat) - var(--sab) - 140px);overflow:auto;
  transform-origin:24px 0;transition:opacity .22s,transform .28s cubic-bezier(.2,.9,.25,1.1);background:var(--glass-hi)}
#menu[hidden]{display:block;opacity:0;transform:scale(.92) translateY(-6px);pointer-events:none;visibility:hidden;transition:opacity .15s,transform .2s,visibility 0s .2s}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:14px;cursor:pointer;user-select:none;-webkit-user-select:none}
.row:active{background:#ffffff0d}
.row input{position:absolute;opacity:0;pointer-events:none}
.row .sw{width:22px;height:22px;border-radius:50%;flex:none;border:2px solid var(--c);display:grid;place-items:center;transition:background .18s}
.row .sw svg{width:12px;height:12px;opacity:0;transform:scale(.5);transition:.18s}
.row input:checked+.sw{background:var(--c)}
.row input:checked+.sw svg{opacity:1;transform:none}
.row .nm{flex:1;font-weight:550}
.row .ct{color:var(--mute);font-variant-numeric:tabular-nums;font-size:13px}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 4px;color:var(--mute);font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.mhead button{color:#9cc3ff;font-size:13px;font-weight:600;text-transform:none;letter-spacing:0;min-height:32px;padding:0 4px}
/* cards */
.sheet{position:fixed;z-index:4;left:calc(var(--sal) + 12px);right:calc(var(--sar) + 12px);bottom:calc(var(--sab) + 12px);margin:0 auto;max-width:420px;border-radius:24px;padding:16px 18px;
  transition:opacity .25s,transform .35s cubic-bezier(.2,.9,.25,1.05)}
.sheet[hidden]{display:block;opacity:0;transform:translateY(24px) scale(.98);pointer-events:none;visibility:hidden;transition:opacity .15s,transform .2s,visibility 0s .2s}
#card .hd{display:flex;align-items:center;gap:10px}
#card .bar{width:6px;align-self:stretch;border-radius:3px;flex:none}
#card .ti{font-weight:700;font-size:17px;line-height:1.25}
#card .su{color:var(--mute);font-size:14px}
#card .x{margin-left:auto;width:32px;height:32px;border-radius:50%;background:#ffffff14;display:grid;place-items:center;flex:none;align-self:flex-start}
#card .bd{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.nx{display:flex;align-items:baseline;gap:10px}
.nx .w{font-variant-numeric:tabular-nums;font-weight:700;font-size:22px;min-width:3.2em}
.nx .w small{font-size:13px;font-weight:600;color:var(--mute);margin-left:2px}
.nx .d{color:#cfd5e1;font-size:14px;line-height:1.3}
.nx i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
#card .ft{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:10px}
.tag{font-size:12px;color:var(--faint);font-weight:600;letter-spacing:.3px}
.btn{height:36px;padding:0 14px;border-radius:18px;background:#ffffff14;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn[aria-pressed=true]{background:#fff;color:#0b0e15}
#toast{text-align:center}
#toast b{display:block;font-size:16px}
#toast span{color:var(--mute);font-size:14px}
#toast .btn{margin-top:10px}
/* disclaimer */
#disc{position:fixed;z-index:3;left:calc(var(--sal) + 12px);bottom:calc(var(--sab) + 12px);border-radius:16px;max-width:min(360px,calc(100vw - 24px));font-size:13px;color:var(--mute);transition:opacity .2s}
#disc summary{list-style:none;cursor:pointer;height:32px;display:flex;align-items:center;gap:6px;padding:0 12px;font-weight:600;font-size:12px;letter-spacing:.3px}
#disc summary::-webkit-details-marker{display:none}
#disc summary svg{width:10px;height:10px;transition:transform .2s;opacity:.7}
#disc[open] summary svg{transform:rotate(180deg)}
#disc p{margin:0;padding:0 14px 12px;line-height:1.45}
#disc a{color:#c3cad8}
body.carded #disc{opacity:0;pointer-events:none}
.maplibregl-ctrl-bottom-right{bottom:var(--sab)!important;right:var(--sar)!important}
.maplibregl-ctrl-attrib{background:#0008!important;color:#7d8597!important;font-size:10px}
.maplibregl-ctrl-attrib a{color:#9aa3b5!important}
.maplibregl-ctrl-attrib-button{filter:invert(1);opacity:.5}
.err{position:fixed;inset:0;display:grid;place-items:center;color:var(--mute);padding:24px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>
<div id="map"></div>
<canvas id="gl" aria-label="Map of Delhi Metro trains"></canvas>
<canvas id="labels" aria-hidden="true"></canvas>

<div class="top">
  <button id="pick" class="pill glass" aria-expanded="false" aria-controls="menu">
    <span class="dots" id="dots"></span><span class="lbl" id="plbl">Lines</span><span class="n" id="pcount"></span>
    <svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4.5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button id="clock" class="pill glass" aria-label="Clock. Tap to change speed"><span class="t" id="time">--:--</span><span class="s" id="spd">LIVE</span></button>
</div>

<div id="menu" class="glass" role="dialog" aria-label="Choose lines" hidden>
  <div class="mhead"><span>Lines</span><span><button id="all">All</button> · <button id="none">None</button></span></div>
  <div id="rows"></div>
</div>

<div id="card" class="sheet glass" hidden aria-live="polite"></div>
<div id="toast" class="sheet glass" hidden></div>

<details id="disc" class="glass">
  <summary>Disclaimer <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 7.5l4-4 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
  <p>A personal project, not affiliated with DMRC. Trains are drawn where the published timetable says they should be, so positions are scheduled or estimated, not live.

</details>

<script>
/*<core>*/
// Pure timetable and geometry logic. Node-tested in tests/positions.test.mjs; keep it free of DOM access.
const DAY = 86400;
const nowIST = (ms = Date.now()) => (((ms / 1000 + 19800) % DAY) + DAY) % DAY;
function merc(lon, lat) {
  const s = Math.sin(lat * Math.PI / 180);
  return [(lon + 180) / 360, 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)];
}
function unmerc(x, y) {
  return [x * 360 - 180, 360 / Math.PI * Math.atan(Math.exp((1 - 2 * y) * Math.PI)) - 90];
}
// Adds sorted starts, duration and Mercator copies of each shape to the routes in data.json.
function prepare(D) {
  for (const r of D.routes) {
    r.starts = [...r.starts].sort((a, b) => a - b);
    r.dur = r.pat[r.pat.length - 1][1];
    const n = r.shape.length;
    r.mx = new Float64Array(n); r.my = new Float64Array(n); r.md = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      const [lon, lat, d] = r.shape[i], m = merc(lon, lat);
      r.mx[i] = m[0]; r.my[i] = m[1]; r.md[i] = d;
    }
  }
  return D;
}
// Where a train is `e` seconds after leaving its first stop: shape distance, pattern index, dwelling or not.
function stateAt(r, e) {
  const p = r.pat, last = p.length - 1;
  if (e <= 0) return { d: p[0][3], i: 0, dwell: true };
  if (e >= r.dur) return { d: p[last][3], i: last, dwell: true };
  let lo = 0, hi = last;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (p[m][1] <= e) lo = m; else hi = m; }
  const a = p[lo];
  if (e <= a[2]) return { d: a[3], i: lo, dwell: true };
  const b = p[lo + 1], f = Math.min(1, (e - a[2]) / ((b[1] - a[2]) || 1));
  return { d: a[3] + (b[3] - a[3]) * f, i: lo, dwell: false };
}
// Mercator point and unit tangent at shape distance d.
function posAt(r, d) {
  const n = r.md.length;
  let lo = 0, hi = n - 1;
  if (d <= r.md[0]) hi = 1; else if (d >= r.md[n - 1]) lo = n - 2;
  else while (hi - lo > 1) { const m = (lo + hi) >> 1; if (r.md[m] <= d) lo = m; else hi = m; }
  const f = Math.max(0, Math.min(1, (d - r.md[lo]) / ((r.md[hi] - r.md[lo]) || 1)));
  let tx = r.mx[hi] - r.mx[lo], ty = r.my[hi] - r.my[lo];
  const L = Math.hypot(tx, ty) || 1; tx /= L; ty /= L;
  return [r.mx[lo] + (r.mx[hi] - r.mx[lo]) * f, r.my[lo] + (r.my[hi] - r.my[lo]) * f, tx, ty];
}
function lowerBound(a, v) { let lo = 0, hi = a.length; while (lo < hi) { const m = (lo + hi) >> 1; if (a[m] < v) lo = m + 1; else hi = m; } return lo; }
// Every train running at time t (seconds of the India day) on the given lines.
function trainsAt(routes, t, lines) {
  const out = [];
  for (const r of routes) {
    if (lines && !lines.has(r.line)) continue;
    for (const tt of [t, t + DAY]) {
      const s = r.starts;
      for (let k = lowerBound(s, tt - r.dur); k < s.length && s[k] <= tt; k++) {
        const e = tt - s[k], st = stateAt(r, e), p = r.pat;
        const next = st.dwell ? p[st.i] : p[st.i + 1];
        out.push({ r, s0: s[k], e, d: st.d, i: st.i, dwell: st.dwell,
          at: st.dwell ? p[st.i][0] : null, next: next[0], eta: s[k] + next[1], pos: posAt(r, st.d) });
      }
    }
  }
  return out;
}
// Points along the track the train covered in the last `back` seconds, oldest first, with 0..1 progress.
function trailPoints(r, e, back) {
  const d1 = stateAt(r, e).d, d0 = stateAt(r, e - back).d;
  if (d1 - d0 < 1) return [];
  const pts = [], a = posAt(r, d0);
  pts.push([a[0], a[1], 0]);
  let i = lowerBound(r.md, d0 + 1e-6);
  for (; i < r.md.length && r.md[i] < d1; i++) pts.push([r.mx[i], r.my[i], (r.md[i] - d0) / (d1 - d0)]);
  const b = posAt(r, d1);
  pts.push([b[0], b[1], 1]);
  return pts;
}
// Next departures from any of `stopIds` on the given lines after time t, soonest first.
function departures(routes, stopIds, t, lines, max = 4) {
  const res = [];
  for (const r of routes) {
    if (lines && !lines.has(r.line)) continue;
    const p = r.pat;
    for (let j = 0; j < p.length - 1; j++) {
      if (!stopIds.has(p[j][0])) continue;
      let best = Infinity;
      for (const s0 of r.starts) {
        for (const a of [s0 + p[j][1], s0 + p[j][1] - DAY]) if (a >= t && a < best) best = a;
      }
      if (best < Infinity) res.push({ r, time: best, to: p[p.length - 1][0] });
    }
  }
  return res.sort((a, b) => a.time - b.time).slice(0, max);
}
/*</core>*/
</script>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const DPR = () => Math.min(window.devicePixelRatio || 1, 3);
const ORDER = ['RED','YELLOW','BLUE','GREEN','VIOLET','PINK','MAGENTA','GRAY','ORANGE/AIRPORT','AQUA','RAPID'];
const NAMES = {RED:'Red',YELLOW:'Yellow',BLUE:'Blue',GREEN:'Green',VIOLET:'Violet',PINK:'Pink',MAGENTA:'Magenta',GRAY:'Grey','ORANGE/AIRPORT':'Airport Express',AQUA:'Aqua',RAPID:'Rapid Metro'};

const SHOW = {BLUE:'#2f86f0',VIOLET:'#a05bd0',MAGENTA:'#e0329f',GRAY:'#a7adb5',RAPID:'#5aa0ec',GREEN:'#33b34f'};
const DEFAULT = ['YELLOW','BLUE'];
const SPEEDS = [0, 10, 60];
const TRAIL_S = 50;
const CDN = ['https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js','https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js'];

let D, R, lines = [], sel = new Set(), color = {}, rgb = {};
let speed = 0, simT = 0, lastReal = performance.now();
let cam, gpu, trains = [], picked = null, follow = false, labelsDirty = true, selDirty = true, refit = false;
const ORIGIN = merc(77.2, 28.6);

/* ---------- time ---------- */
function curT() {
  const n = performance.now();
  if (speed === 0) { lastReal = n; return nowIST(); }
  simT = (simT + (n - lastReal) / 1000 * speed) % DAY; lastReal = n; return simT;
}
function setSpeed(s) { if (s && !speed) simT = nowIST(); speed = s; lastReal = performance.now(); paintClock(true); }
const hhmm = s => { s = ((Math.floor(s) % DAY) + DAY) % DAY; return String(s / 3600 | 0).padStart(2, '0') + ':' + String((s % 3600) / 60 | 0).padStart(2, '0'); };

/* ---------- colours ---------- */
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; }

/* ---------- WebGL renderer (shared by the MapLibre custom layer and the stand-alone fallback) ---------- */
const LINE_VS = `precision highp float;
attribute vec2 a_pos,a_prev,a_next;attribute float a_side;attribute vec4 a_col;
uniform mat4 u_m;uniform vec2 u_res;uniform float u_w,u_off;
varying vec4 v_col;varying float v_s;
vec2 scr(vec4 c){return c.xy/c.w*u_res*.5;}
void main(){
  vec4 c=u_m*vec4(a_pos,0.,1.);vec2 s=scr(c),sp=scr(u_m*vec4(a_prev,0.,1.)),sn=scr(u_m*vec4(a_next,0.,1.));
  vec2 t1=s-sp,t2=sn-s;
  if(dot(t1,t1)<1e-8)t1=t2; if(dot(t2,t2)<1e-8)t2=t1; if(dot(t1,t1)<1e-8){t1=vec2(1.,0.);t2=t1;}
  t1=normalize(t1);t2=normalize(t2);vec2 tg=t1+t2;
  if(dot(tg,tg)<1e-6)tg=t1; else tg=normalize(tg);
  vec2 n=vec2(-tg.y,tg.x);float ml=1./max(dot(n,vec2(-t1.y,t1.x)),.5);

const LINE_FS = `precision highp float;varying vec4 v_col;varying float v_s;uniform float u_w,u_glow;
void main(){float d=abs(v_s),a;
  if(u_glow>.5){float x=clamp(d/(u_w*.5+1.),0.,1.);a=(1.-x)*(1.-x)*.28;}else a=clamp(u_w*.5+.5-d,0.,1.);
  gl_FragColor=vec4(v_col.rgb,1.)*v_col.a*a;}`;
const PT_VS = `precision highp float;
attribute vec2 a_pos,a_dir;attribute vec4 a_col;attribute float a_size,a_kind;
uniform mat4 u_m;uniform vec2 u_res;uniform float u_off,u_scale;
varying vec4 v_col;varying float v_kind;
void main(){
  vec4 c=u_m*vec4(a_pos,0.,1.);vec2 s=c.xy/c.w*u_res*.5;
  if(dot(a_dir,a_dir)>0.){vec4 c2=u_m*vec4(a_pos+a_dir*1e-6,0.,1.);vec2 t=c2.xy/c2.w*u_res*.5-s;
    if(dot(t,t)>1e-12){t=normalize(t);s+=vec2(-t.y,t.x)*u_off;}}
  gl_Position=vec4(s/(u_res*.5)*c.w,0.,c.w);gl_PointSize=a_size*u_scale;v_col=a_col;v_kind=a_kind;

const PT_FS = `precision highp float;varying vec4 v_col;varying float v_kind;uniform float u_body;
void main(){vec2 p=gl_PointCoord*2.-1.;float r=length(p);if(r>1.)discard;
  if(v_kind<.5){ // train: additive glow pass, or the solid body on top
    if(u_body<.5){gl_FragColor=vec4(v_col.rgb*exp(-r*r*4.5)*.75,0.)*v_col.a;}
    else{float aa=.07;float edge=smoothstep(.52,.52-aa,r);float body=smoothstep(.43,.43-aa,r);float core=smoothstep(.2,.2-aa,r);
      vec3 c=mix(vec3(.03,.04,.07),mix(v_col.rgb,vec3(1.),.25),body);c=mix(c,vec3(1.),core*.9);gl_FragColor=vec4(c,1.)*edge*v_col.a;}}
  else if(v_kind<1.5){float ring=smoothstep(.98,.84,r);float inner=smoothstep(.58,.46,r);
    gl_FragColor=vec4(mix(v_col.rgb,vec3(.035,.045,.07),inner),1.)*ring*v_col.a;}
  else{float a=smoothstep(1.,.9,r)*smoothstep(.74,.84,r);gl_FragColor=vec4(1.)*a*v_col.a;}
}`;

class Buf { // growable Float32 / Uint16 writer
  constructor(T, n = 4096) { this.T = T; this.a = new T(n); this.n = 0; }
  reset() { this.n = 0; }
  need(k) { if (this.n + k > this.a.length) { let m = this.a.length * 2; while (m < this.n + k) m *= 2; const b = new this.T(m); b.set(this.a); this.a = b; } }
  push(...v) { this.need(v.length); for (const x of v) this.a[this.n++] = x; }
  view() { return this.a.subarray(0, this.n); }
}
function polyline(V, I, pts, rgba, fade) { // pts: [[x,y,f?]] in relative Mercator
  const n = pts.length; if (n < 2) return;
  const base = V.n / 11; if (base + n * 2 > 65000) return;
  for (let i = 0; i < n; i++) {
    const p = pts[i], a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    const al = fade ? rgba[3] * Math.pow(p[2], 1.6) : rgba[3];
    V.push(p[0], p[1], a[0], a[1], b[0], b[1], -1, rgba[0], rgba[1], rgba[2], al);

function openMenu(open) {
  $('menu').hidden = !open; $('pick').setAttribute('aria-expanded', open);
  if (!open && refit) { refit = false; if (stations.length) cam.fit(selBounds(), true); }
}
$('pick').onclick = e => { e.stopPropagation(); openMenu($('menu').hidden); };
$('all').onclick = () => { lines.forEach(l => sel.add(l)); selChanged(); };
$('none').onclick = () => { sel.clear(); selChanged(); };
document.addEventListener('pointerdown', e => { if (!$('menu').hidden && !e.target.closest('#menu,#pick')) openMenu(false); }, true);
$('clock').onclick = () => setSpeed(SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]);

function paintClock(force) {
  const t = curT(); $('time').textContent = hhmm(t);
  $('spd').textContent = speed ? speed + '×' : 'LIVE'; $('clock').classList.toggle('sim', !!speed);
}
let counts = {};
function paintCounts() {
  let tot = 0; for (const l of lines) { const n = counts[l] || 0; if (sel.has(l)) tot += n; }
  $('pcount').textContent = sel.size ? `· ${tot}` : '';
  $('pick').setAttribute('aria-label', `${$('plbl').textContent}, ${tot} trains running. Choose lines`);
  // menu counts need every line, cheap enough to do at 4 Hz
  const all = {}; for (const o of trainsAt(R, curT(), null)) all[o.r.line] = (all[o.r.line] || 0) + 1;
  for (const el of $('rows').querySelectorAll('[data-c]')) el.textContent = all[el.dataset.c] || '';
  // nothing running on the chosen lines: offer to skip ahead
  const empty = sel.size > 0 && tot === 0 && !picked;
  if (empty !== !$('toast').hidden) {
    $('toast').hidden = !empty;
    if (empty) $('toast').innerHTML = `<b>The trains are asleep</b><span>Service runs from about 5:30 to 23:30.</span><br><button class="btn" id="ff">Skip to 8 am</button>`, $('ff').onclick = () => { simT = 8 * 3600; speed = 10; lastReal = performance.now(); paintClock(); };
  }
}

/* ---------- picking ---------- */
function tap(x, y) {
  if (!$('menu').hidden) return openMenu(false);
  let best = null, bd = 26;
  for (const o of trains) { const [a, b] = cam.project(o.pos[0], o.pos[1]), d = Math.hypot(a - x, b - y); if (d < bd) { bd = d; best = { kind: 'train', r: o.r, s0: o.s0, o }; } }
  if (!best) { bd = 20; for (const s of stations) { const [a, b] = cam.project(s.m[0], s.m[1]), d = Math.hypot(a - x, b - y); if (d < bd) { bd = d; best = { kind: 'station', s }; } } }
  if (!best) return closeCard();
  picked = best; setFollow(false); paintCard(); $('card').hidden = false; document.body.classList.add('carded');
}
function closeCard() { picked = null; setFollow(false); $('card').hidden = true; document.body.classList.remove('carded'); }
function setFollow(f) { follow = f; const b = $('follow'); if (b) b.setAttribute('aria-pressed', f); }
const mins = s => { const m = Math.round(s / 60); return m <= 0 ? ['now', ''] : [m, 'min']; };
function paintCard() {
  if (!picked) return;
  const t = curT(), el = $('card');
  if (picked.kind === 'train') {
    const o = trains.find(q => q.r === picked.r && q.s0 === picked.s0);
    if (!o) return closeCard();
    const r = o.r, to = D.stops[r.pat[r.pat.length - 1][0]][0], nm = D.stops[o.next][0], [w, u] = mins(o.eta - t);
    el.innerHTML = `<div class="hd"><span class="bar" style="background:${color[r.line]}"></span><div><div class="ti">${NAMES[r.line]} Line</div><div class="su">to ${to}</div></div>
      <button class="x" aria-label="Close" id="cx"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></button></div>
      <div class="bd"><div class="nx">${o.dwell ? `<span class="w">At</span><span class="d">${nm}</span>` : `<span class="w">${w}<small>${u}</small></span><span class="d">Next stop<br><b style="color:#fff">${nm}</b></span>`}</div></div>
      <div class="ft"><span class="tag">${r.est ? 'ESTIMATED' : 'SCHEDULED'} · LEFT ${D.stops[r.pat[0][0]][0].toUpperCase()} ${hhmm(o.s0)}</span><button class="btn" id="follow" aria-pressed="${follow}">Follow</button></div>`;
    $('follow').onclick = () => setFollow(!follow);
  } else {
    const s = picked.s, deps = departures(R, s.ids, t, sel, 4);
    el.innerHTML = `<div class="hd"><div><div class="ti">${s.name}</div><div class="su">${[...s.lines].sort((a, b) => ORDER.indexOf(a) - ORDER.indexOf(b)).map(l => `<i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color[l]};margin-right:4px"></i>`).join('')}</div></div>
      <button class="x" aria-label="Close" id="cx"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></button></div>
      <div class="bd">${deps.length ? deps.map(d => { const [w, u] = mins(d.time - t); return `<div class="nx"><span class="w">${w}<small>${u}</small></span><span class="d"><i style="background:${color[d.r.line]}"></i>to ${D.stops[d.to][0]}${d.r.est ? ' <span class="tag">EST.</span>' : ''}</span></div>`; }).join('') : '<div class="su">No more trains today.</div>'}</div>`;
  }
  $('cx').onclick = closeCard;
}

/* ---------- loop ---------- */
let lastUi = 0;
function frame(now) {
  const t = curT();
  if (selDirty) { selDirty = false; buildStatic(); }
  counts = buildDynamic(t);
  if (follow && picked && picked.o) cam.center(picked.o.pos[0], picked.o.pos[1]);
  cam.redraw();
  if (labelsDirty) { labelsDirty = false; drawLabels(); }
  if (now - lastUi > 250) { lastUi = now; paintClock(); paintCounts(); paintCard(); }
  requestAnimationFrame(frame);
}
addEventListener('resize', () => labelsDirty = true);

/* ---------- boot ---------- */
function loadScript(src, ms) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.async = true; s.crossOrigin = 'anonymous';
    const to = setTimeout(() => rej(new Error('timeout')), ms); s.onload = () => { clearTimeout(to); res(); }; s.onerror = () => { clearTimeout(to); rej(new Error('load')); };
    document.head.appendChild(s); });
}
async function getMapLibre() { for (const u of CDN) { try { await loadScript(u, 6000); if (window.maplibregl) return window.maplibregl; } catch (e) {} } return null; }

Promise.all([fetch('data.json').then(r => r.json()), getMapLibre()]).then(async ([data, ml]) => {
  D = prepare(data); R = D.routes;
  lines = ORDER.filter(l => R.some(r => r.line === l)).concat([...new Set(R.map(r => r.line))].filter(l => !ORDER.includes(l)));
  for (const l of lines) { color[l] = SHOW[l] || D.colors[l] || '#ffffff'; rgb[l] = hexRgb(color[l]); }
  let saved = null; try { saved = JSON.parse(localStorage.getItem('maptro-lines')); } catch (e) {}
  sel = new Set((Array.isArray(saved) ? saved : DEFAULT).filter(l => lines.includes(l)));
  buildMenu(); paintPicker();
  gpu = makeGpu(); buildStatic(); selDirty = false;
  try { cam = ml ? mapLibreCamera(ml) : canvasCamera(); await cam.ready; }
  catch (e) { try { if (cam && cam.map) cam.map.remove(); cam = canvasCamera(); } catch (e2) { document.body.insertAdjacentHTML('beforeend', '<div class="err">This map needs WebGL, which this browser has turned off.</div>'); return; } }
  cam.fit(selBounds(), false);
  document.documentElement.dataset.ready = cam.kind;
  // used by the screenshot script to find a train to tap
  window.__maptro = { trainsOnScreen: () => trains.map(o => cam.project(o.pos[0], o.pos[1])) };
  requestAnimationFrame(frame);
}).catch(e => { document.body.insertAdjacentHTML('beforeend', '<div class="err">Couldn\'t load the timetable. Pull to refresh.</div>'); console.error(e); });
})();
</script>
</body></html>
